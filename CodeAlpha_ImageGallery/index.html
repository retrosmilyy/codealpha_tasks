<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="edit.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Outfit:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background" id="background"></div>
    <div class="vignette"></div>

    <div class="wrapper">
      <div class="categories" id="categories"></div>

      <div class="card">
        <div class="card-image-wrap" id="imageWrap">
          <img id="imgA" src="" alt="" />
          <img id="imgB" src="" alt="" />
          <div class="zoom-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <line x1="16.5" y1="16.5" x2="22" y2="22" />
              <line x1="11" y1="8" x2="11" y2="14" />
              <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
          </div>
          <div class="cat-badge" id="catBadge"></div>
        </div>

        <div class="card-info">
          <div class="card-counter" id="counter">01 / 10</div>
          <div class="card-title" id="cardTitle"></div>
          <div class="card-sub" id="cardSub"></div>
        </div>

        <div class="card-buttons">
          <button class="btn" id="prevBtn" disabled>
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
            Prev
          </button>
          <span class="counter" id="counterSmall">1 / 10</span>
          <button class="btn" id="nextBtn">
            Next
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="lightbox" id="lightbox">
      <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
      <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose">✕ close</button>
        <img id="lightboxImg" src="" alt="" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
